<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>:root { --w: 540px; --h: 960px; } 
.kicker { font-size: 11px; padding: 6px 11px; letter-spacing: 0.14em; }
.checks { gap: 9px; }
.checks li { font-size: 16px; gap: 10px; }
.checks li::before { width: 22px; height: 22px; font-size: 13px; }
.card { border-radius: 12px; padding: 5px; box-shadow: 0 18px 40px rgba(10,5,40,0.5), 0 0 0 1px rgba(255,255,255,0.4); }
.card img { border-radius: 8px; }
.phone { border-radius: 18px; padding: 5px; }
.phone img { border-radius: 14px; }
.cta { display: inline-flex; align-items: center; gap: 8px; background: #fff; color: #4c1d95; font-weight: 800;
       font-size: 15px; padding: 11px 18px; border-radius: 99px; box-shadow: 0 10px 24px rgba(10,5,40,0.35); }
.price { display: inline-block; background: #10b981; color: #fff; font-weight: 800; font-size: 15px; padding: 9px 14px; border-radius: 99px; }
.foot { position: absolute; left: 34px; right: 34px; display: flex; justify-content: space-between; align-items: center; }

    .top { position: absolute; left: 34px; right: 34px; top: 128px; }
    h1 { font-size: 50px; margin-top: 14px; line-height: 1.0; }
    .pills { position: absolute; left: 30px; top: 360px; display: grid; gap: 14px; }
    .pill { transform: rotate(var(--r)); background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3);
            font-weight: 700; font-size: 16px; padding: 10px 14px; border-radius: 12px; white-space: nowrap;
            box-shadow: 0 10px 24px rgba(10,5,40,0.25); width: max-content; }
    .phone { position: absolute; right: 26px; top: 336px; width: 214px; transform: rotate(4deg); }
    .tag { position: absolute; left: 34px; right: 34px; top: 694px; font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.85); }
    .foot { top: 730px; }
    .price { font-size: 19px; padding: 11px 18px; }
    .cta { font-size: 16px; }
    </style></head><body>
    <div class="top"><span class="kicker">n8n AI agents · starter pack</span>
      <h1 class="display">10 AI agents that work <span class="grad-text">while you sleep</span></h1></div>
    <div class="pills"><div class="pill" style="--r:-3deg">💬 WhatsApp bot</div><div class="pill" style="--r:2deg">🌐 Website chatbot</div><div class="pill" style="--r:-2deg">🎯 Lead finder</div><div class="pill" style="--r:3deg">📬 AI email replies</div><div class="pill" style="--r:-1deg">➕ 6 more agents</div></div>
    <div class="card phone"><img src="../../build/screenshots/chat/chat-answer.png"></div>
    <div class="tag">Ready-made n8n templates · No coding · Setup guide included</div>
    <div class="foot"><span class="price">Only $9</span><span class="cta">Get it below ↓</span></div>
    </body></html>
